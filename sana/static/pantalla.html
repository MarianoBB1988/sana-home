<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sana</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0e0f0d;  /* gris casi negro */
    cursor: none;
  }
  body { display: grid; place-items: center; }
  #animacion {
    width: min(72vmin, 720px); aspect-ratio: 1;
    transition: opacity .8s ease, transform .8s ease, filter .8s ease;
  }
  #animacion svg, #animacion canvas { width: 100%; height: 100%; display: block; }
  /* En pausa: quieta, más chica y apagada */
  body.pausa #animacion { opacity: .28; transform: scale(.92); filter: saturate(.6); }
  body:not(.pausa) #animacion { opacity: 1; transform: scale(1); }
</style>
</head>
<body class="pausa">
<div id="animacion" aria-label="Sana"></div>
<script type="module">
  // Dos tipos de animación, con la misma idea: correr cuando Sana está activa y quedar quieta en pausa.
  //  - SVG: va dentro de la página (no como <img>) para poder pausar sus animaciones SMIL.
  //  - Lottie (.lottie o .json): se dibuja en un <canvas> con dotlottie-web, guardado en el proyecto (anda sin internet).
  let control = null;  // { reproducir(), pausar() }
  let estado = "pausa";

  function aplicar() {
    document.body.classList.toggle("pausa", estado === "pausa");
    if (!control) return;
    if (estado === "pausa") control.pausar(); else control.reproducir();
  }

  async function cargar() {
    const info = await (await fetch("/animacion-info")).json();
    const contenedor = document.getElementById("animacion");
    if (info.tipo === "svg") {
      contenedor.innerHTML = await (await fetch(info.url)).text();
      const svg = contenedor.querySelector("svg");
      control = { reproducir: () => svg.unpauseAnimations(), pausar: () => svg.pauseAnimations() };
      aplicar();
      return;
    }
    const { DotLottie } = await import("/vendor/dotlottie/index.js");
    DotLottie.setWasmUrl("/vendor/dotlottie/dotlottie-player.wasm");
    const canvas = document.createElement("canvas");
    contenedor.append(canvas);
    const lottie = new DotLottie({
      canvas,
      src: info.url,  // /animacion.lottie o /animacion.json
      loop: true,
      autoplay: false,
      renderConfig: { devicePixelRatio: window.devicePixelRatio || 1 },  // nítido en pantallas de alta densidad
    });
    control = { reproducir: () => lottie.play(), pausar: () => lottie.pause() };
    window.lottie = lottie;  // para mirar el estado desde las herramientas del navegador
    lottie.addEventListener("load", aplicar);
    lottie.addEventListener("loadError", (e) => console.error("No pude cargar la animación", e));
  }
  cargar();

  // Sana avisa sus cambios de estado al instante; si se corta, el navegador reconecta solo.
  const eventos = new EventSource("/estado");
  eventos.onmessage = (e) => { estado = e.data; aplicar(); };
</script>
</body>
</html>
