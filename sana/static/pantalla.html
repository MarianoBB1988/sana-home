<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sana</title>
<style>
  @font-face { font-family: "Inter"; src: url(/fuentes/inter-400.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; src: url(/fuentes/jetbrains-mono-400.woff2) format("woff2"); }

  :root {
    --fondo: #0e0f0d;
    --texto: rgba(226, 232, 255, .78);
    --tenue: rgba(150, 170, 220, .55);
    --cian: #5ad8ff;
    --azul: #3b6bff;
    --violeta: #a259ff;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #14161d 0%, var(--fondo) 60%);
    color: var(--texto);
    font-family: "Inter", system-ui, sans-serif;
    cursor: none;
  }
  .escena {
    height: 100%;
    display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center;
    padding: 6vh 0 9vh;
    box-sizing: border-box;
  }

  /* ---------- La animación ---------- */
  #animacion {
    width: min(58vmin, 620px); aspect-ratio: 1;
    transition: opacity .8s ease, transform .8s ease, filter .8s ease;
  }
  #animacion svg, #animacion canvas { width: 100%; height: 100%; display: block; }
  body.pausa #animacion { opacity: .3; transform: scale(.9); filter: saturate(.6); }

  /* ---------- Zona de abajo: mensaje en pausa / estado cuando está activa ---------- */
  .abajo { position: relative; width: min(90vw, 900px); height: 150px; display: grid; place-items: center; }
  .mensaje, .estado {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    transition: opacity .9s ease, filter .9s ease, transform .9s ease;
  }
  body:not(.pausa) .mensaje { opacity: 0; filter: blur(10px); transform: translateY(10px); }
  body.pausa .estado { opacity: 0; filter: blur(10px); transform: translateY(-10px); }

  /* Etiqueta tipo HUD */
  .etiqueta {
    font: 400 12px/1 "JetBrains Mono", monospace; letter-spacing: .38em; text-transform: uppercase;
    color: var(--tenue); display: flex; align-items: center; gap: 12px;
  }
  .punto {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cian);
    box-shadow: 0 0 10px var(--cian), 0 0 22px rgba(90, 216, 255, .5);
    animation: latido 2.2s ease-in-out infinite;
  }
  @keyframes latido { 50% { opacity: .25; transform: scale(.7); } }

  /* La frase: las palabras aparecen de a una, saliendo de un desenfoque, y una luz la recorre cada tanto */
  .frase { margin: 0; font-size: clamp(20px, 3vw, 40px); letter-spacing: .01em; text-align: center; line-height: 1.3; }
  .frase span {
    display: inline-block; opacity: 0;
    background: linear-gradient(100deg, var(--texto) 42%, #fff 50%, var(--texto) 58%) 160% 0 / 260% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  /* La animación no depende de la pausa: así, al activarse Sana, las palabras no se apagan de golpe sino que se
     desvanecen junto con el bloque. Al volver a la pausa el bloque se recrea y entran de nuevo de a una. */
  .frase span {
    animation: aparecer 1.1s cubic-bezier(.2, .7, .2, 1) forwards, brillo 6s ease-in-out infinite;
    animation-delay: calc(var(--i) * 130ms + 350ms), calc(var(--i) * 60ms + 2.4s);
  }
  @keyframes aparecer {
    from { opacity: 0; filter: blur(10px); transform: translateY(14px); }
    to { opacity: 1; filter: blur(0); transform: none; }
  }
  @keyframes brillo { 0%, 55% { background-position: 160% 0; } 100% { background-position: -60% 0; } }

  /* "Sana": degradado que fluye y brilla */
  .frase .clave {
    padding: 0 .12em; letter-spacing: .06em;
    background: linear-gradient(90deg, var(--cian), var(--azul), var(--violeta), var(--cian)) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(70, 130, 255, .55));
  }
  .frase .clave {
    animation: aparecer 1.1s cubic-bezier(.2, .7, .2, 1) forwards, fluir 5s linear infinite;
    animation-delay: calc(var(--i) * 130ms + 350ms), 0s;
  }
  @keyframes fluir { to { background-position: 300% 0; } }

  /* Línea de escaneo */
  .linea {
    position: relative; height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, rgba(90, 216, 255, .5), rgba(162, 89, 255, .5), transparent);
  }
  .linea { animation: abrir 1.4s cubic-bezier(.2, .7, .2, 1) 1.1s forwards; }
  .linea::after {
    content: ""; position: absolute; top: -2px; left: 0; width: 70px; height: 5px; border-radius: 50%;
    background: radial-gradient(closest-side, #fff, rgba(90, 216, 255, .6), transparent);
    animation: escanear 3.8s ease-in-out infinite;
  }
  @keyframes abrir { to { width: min(560px, 70vw); } }
  @keyframes escanear { 0% { left: -70px; opacity: 0; } 15%, 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

  /* ---------- Estado mientras está activa ---------- */
  .barras { display: flex; gap: 6px; height: 34px; align-items: center; }
  .barras i {
    width: 4px; height: 100%; border-radius: 4px;
    background: linear-gradient(var(--cian), var(--azul), var(--violeta));
    box-shadow: 0 0 10px rgba(80, 150, 255, .5);
    transform: scaleY(.25);
    animation: ecualizador 1s ease-in-out infinite;
    animation-delay: calc(var(--i) * -170ms);
  }
  @keyframes ecualizador { 50% { transform: scaleY(1); } }
  body[data-estado="pensando"] .barras i { animation: pensar 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * 120ms); }
  @keyframes pensar { 0%, 100% { transform: scaleY(.2); opacity: .4; } 40% { transform: scaleY(.55); opacity: 1; } }
  body[data-estado="hablando"] .barras i { animation-duration: .6s; }
  .estado-texto {
    font: 400 13px/1 "JetBrains Mono", monospace; letter-spacing: .4em; text-transform: uppercase; color: var(--tenue);
    display: flex; align-items: baseline;
  }
  /* Cambio de "Escuchando" a "Pensando": el texto viejo se desvanece y el nuevo aparece */
  #estado-nombre { transition: opacity .35s ease, filter .35s ease; }
  #estado-nombre.cambiando { opacity: 0; filter: blur(4px); }
  /* Puntos suspensivos: cada uno aparece y se desvanece en secuencia */
  .puntos b { font-weight: 400; opacity: 0; animation: punto 1.6s ease-in-out infinite; }
  .puntos b:nth-child(2) { animation-delay: .25s; }
  .puntos b:nth-child(3) { animation-delay: .5s; }
  @keyframes punto { 0%, 100% { opacity: 0; } 30%, 60% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .frase span { opacity: 1; }
  }
</style>
</head>
<body class="pausa" data-estado="pausa">
<div class="escena">
  <div id="animacion" aria-hidden="true"></div>
  <div class="abajo">
    <div class="mensaje" id="mensaje">
      <div class="etiqueta"><span class="punto"></span>En espera</div>
      <p class="frase">
        <span style="--i:0">Decí</span>
        <span class="clave" style="--i:1">Sana</span>
        <span style="--i:2">para</span>
        <span style="--i:3">comenzar</span>
        <span style="--i:4">a</span>
        <span style="--i:5">hablar</span>
      </p>
      <div class="linea"></div>
    </div>
    <div class="estado" aria-live="polite">
      <div class="barras"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></div>
      <div class="estado-texto"><span id="estado-nombre">Escuchando</span><span class="puntos"><b>.</b><b>.</b><b>.</b></span></div>
    </div>
  </div>
</div>

<script type="module">
  // Dos tipos de animación, con la misma idea: correr cuando Sana está activa y quedar quieta en pausa.
  //  - SVG: va dentro de la página (no como <img>) para poder pausar sus animaciones SMIL.
  //  - Lottie (.lottie o .json): se dibuja en un <canvas> con dotlottie-web, guardado en el proyecto (anda sin internet).
  let control = null;  // { reproducir(), pausar() }
  let estado = "pausa";
  const NOMBRES = { escuchando: "Escuchando", pensando: "Pensando", hablando: "Hablando" };

  // Fundido entre nombres de estado: se apaga el viejo, se cambia el texto y se enciende el nuevo
  let cambioPendiente = null;
  function cambiarNombre(nuevo) {
    const el = document.getElementById("estado-nombre");
    if (!nuevo || el.textContent === nuevo) return;
    clearTimeout(cambioPendiente);
    el.classList.add("cambiando");
    cambioPendiente = setTimeout(() => { el.textContent = nuevo; el.classList.remove("cambiando"); }, 350);
  }

  function aplicar() {
    const enPausa = estado === "pausa";
    if (enPausa && !document.body.classList.contains("pausa")) {
      // Volver a mostrar el mensaje con su animación de entrada desde el principio
      const mensaje = document.getElementById("mensaje");
      mensaje.replaceWith(mensaje.cloneNode(true));
    }
    document.body.classList.toggle("pausa", enPausa);
    document.body.dataset.estado = estado;
    cambiarNombre(NOMBRES[estado]);
    if (!control) return;
    if (enPausa) control.pausar(); else control.reproducir();
  }

  async function cargar() {
    const info = await (await fetch("/animacion-info")).json();
    const contenedor = document.getElementById("animacion");
    if (info.tipo === "svg") {
      contenedor.innerHTML = await (await fetch(info.url)).text();
      const svg = contenedor.querySelector("svg");
      control = { reproducir: () => svg.unpauseAnimations(), pausar: () => svg.pauseAnimations() };
      aplicar();
      return;
    }
    const { DotLottie } = await import("/vendor/dotlottie/index.js");
    DotLottie.setWasmUrl("/vendor/dotlottie/dotlottie-player.wasm");
    const canvas = document.createElement("canvas");
    contenedor.append(canvas);
    const lottie = new DotLottie({
      canvas,
      src: info.url,  // /animacion.lottie o /animacion.json
      loop: true,
      autoplay: false,
      renderConfig: { devicePixelRatio: window.devicePixelRatio || 1 },  // nítido en pantallas de alta densidad
    });
    control = { reproducir: () => lottie.play(), pausar: () => lottie.pause() };
    window.lottie = lottie;  // para mirar el estado desde las herramientas del navegador
    lottie.addEventListener("load", aplicar);
    lottie.addEventListener("loadError", (e) => console.error("No pude cargar la animación", e));
  }
  cargar();

  // Sana avisa sus cambios de estado al instante; si se corta, el navegador reconecta solo.
  const eventos = new EventSource("/estado");
  eventos.onmessage = (e) => { estado = e.data; aplicar(); };
</script>
</body>
</html>
